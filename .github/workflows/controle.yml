name: Controleer wijziging

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    name: Typecheck en productiebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: github-controle-geen-productiegeheim-123456789
      DATABASE_URL: file:./krachtbal-ci.db
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: pnpm installeren
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Dependencies installeren
        run: pnpm install --frozen-lockfile

      - name: TypeScript controleren
        run: pnpm typecheck

      - name: Unit-tests uitvoeren
        run: pnpm test:unit

      - name: Productiebuild controleren
        run: pnpm build

  # De integratietests praten met een echte (SQLite-)databank via de echte routes: de wedstrijddag,
  # boetes, klachten, de federatieketen van eerste lid tot boete (tests/int/federatie-keten.int.spec.ts).
  # Ze liepen vroeger nergens automatisch, waardoor er stil zes konden breken. Een aparte job, zodat
  # ze naast de build lopen en de PR-controle niet dubbel zo lang maakt.
  integratie:
    name: Integratietests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAYLOAD_SECRET: github-controle-geen-productiegeheim-123456789
      DATABASE_URL: file:./krachtbal-int.db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - name: pnpm installeren
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Dependencies installeren
        run: pnpm install --frozen-lockfile
      - name: Integratietests uitvoeren
        run: pnpm test:int
