<!doctype html><html><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js"}}</script>
<canvas id="c" width="1200" height="1200"></canvas>
<script type="module">
import * as THREE from './three/build/three.module.js'
import { RoomEnvironment } from './three/examples/jsm/environments/RoomEnvironment.js'
import { krachtbalGeometrie, krachtbalTextuur } from './krachtbal.js'
const canvas = document.getElementById('c')
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true })
r.setPixelRatio(1); r.setSize(1200, 1200, false)
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.82
r.outputColorSpace = THREE.SRGBColorSpace
const scene = new THREE.Scene()
const pmrem = new THREE.PMREMGenerator(r)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50)
cam.position.set(0, 0.35, 6.4); cam.lookAt(0, 0, 0)
// Zelfde materiaal als de gouden ballen in goudjacht.ts.
const mat = new THREE.MeshStandardMaterial({ map: krachtbalTextuur('#f2c230', '#3b2606'), vertexColors: true, emissive: '#a16207', emissiveIntensity: 0.25, metalness: 0.65, roughness: 0.38 })
const bal = new THREE.Mesh(krachtbalGeometrie(1.2, 2), mat)
bal.rotation.set(0.32, -0.42, -0.38)
scene.add(bal)
const key = new THREE.DirectionalLight("#fff0cc", 1.7); key.position.set(-3, 4, 5); scene.add(key)
const rim = new THREE.DirectionalLight('#ffd27a', 1.4); rim.position.set(4, -1, -3); scene.add(rim)
scene.add(new THREE.AmbientLight("#ffffff", 0.08)); scene.environmentIntensity = 0.75
r.render(scene, cam)
window.KLAAR = true
</script></body></html>
